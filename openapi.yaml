openapi: 3.0.3
info:
  title: AffiDeck API
  description: |
    # AffiDeck Backend API
    
    A comprehensive API for an affiliate marketing platform with marketplace, capital lending, communities, and referral capabilities.
    
    ## Authentication
    
    Most endpoints require token-based authentication using Bearer tokens. After login or registration, use the returned `access_token` in the `Authorization: Bearer {token}` header.
    
    Tokens expire after 15 minutes; use the `refresh_token` to obtain new tokens.
    
    ## Pagination
    
    List endpoints support `?page=&per_page=` query parameters. Responses include pagination metadata.
    
    ## Error Responses
    
    All errors return a JSON object with:
    - `message`: Human-readable error message
    - `errors` (optional): Field-specific validation errors
  version: 1.0.0
  contact:
    name: AffiDeck API Support
servers:
  - url: http://localhost/api
    description: Local development
  - url: https://api.affideck.com
    description: Production

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                referrer_code:
                  type: string
                  maxLength: 64
                  nullable: true
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /auth/login:
    post:
      summary: Login with email and password
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /auth/refresh:
    post:
      summary: Refresh access token using refresh token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /auth/password/email:
    post:
      summary: Send password reset link to email
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset link sent (if user exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/password/reset:
    post:
      summary: Reset password with token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          description: Invalid token or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /auth/oauth/{provider}:
    post:
      summary: OAuth login (not yet connected)
      tags: [Auth]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, apple, facebook]
      responses:
        '501':
          description: OAuth provider not yet implemented
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /me:
    get:
      summary: Get current authenticated user profile
      tags: [Core]
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /logout:
    post:
      summary: Logout and revoke access token
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Optional refresh token to also revoke
      responses:
        '204':
          description: Successfully logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /navigation:
    get:
      summary: Get filtered navigation menu for authenticated user
      tags: [Core]
      responses:
        '200':
          description: Navigation tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                        href:
                          type: string
                        permission:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /live-feed:
    get:
      summary: Get live ticker feed (public and cached)
      tags: [Core]
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated ticker items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeed'

  /notifications:
    get:
      summary: List notifications for authenticated user
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
          description: Filter to unread only
      responses:
        '200':
          description: Paginated notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}:
    patch:
      summary: Mark notification as read or unread
      tags: [Notifications]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read:
                  type: boolean
      responses:
        '200':
          description: Notification updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/mark-all-read:
    post:
      summary: Mark all notifications as read
      tags: [Notifications]
      responses:
        '204':
          description: All notifications marked as read
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/stream:
    get:
      summary: Server-Sent Events stream for real-time notifications
      tags: [Notifications]
      responses:
        '200':
          description: SSE stream of notification events
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  unread_count:
                    type: integer
                  ts:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/summary:
    get:
      summary: Get dashboard summary metrics
      tags: [Dashboard]
      responses:
        '200':
          description: Summary metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      earnings:
                        type: number
                        format: double
                      clicks:
                        type: integer
                      conversions:
                        type: integer
                      epc:
                        type: number
                        format: double
                        description: Earnings Per Click
                      delta24h:
                        type: number
                        format: double
                        description: Change in last 24 hours
                      balance:
                        type: number
                        format: double
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/chart:
    get:
      summary: Get dashboard chart data
      tags: [Dashboard]
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d, 90d]
            default: 7d
      responses:
        '200':
          description: Timeseries chart data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        value:
                          type: number
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/top-offers:
    get:
      summary: Get top performing offers
      tags: [Dashboard]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Top offers with metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Offer'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/export:
    post:
      summary: Export analytics data
      tags: [Dashboard]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                range:
                  type: string
                  enum: [24h, 7d, 30d, 90d]
                metrics:
                  type: array
                  items:
                    type: string
      responses:
        '202':
          description: Export job enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'

  /offers:
    get:
      summary: List offers (public with optional auth enhancements)
      tags: [Offers]
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query
        - name: category
          in: query
          schema:
            type: string
        - name: geo
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, popular, highest_payout]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated offers list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Offer'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      summary: Create a new offer (advertiser/partner only)
      tags: [Offers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, payout]
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [cpa, cpc, cpv]
                payout:
                  type: number
                  format: double
                tags:
                  type: array
                  items:
                    type: string
                categories:
                  type: array
                  items:
                    type: string
                geo:
                  type: array
                  items:
                    type: string
                creatives:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Offer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Offer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /offers/{offerId}:
    get:
      summary: Get offer details
      tags: [Offers]
      security: []
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '200':
          description: Offer details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Offer'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update offer (owner/admin only)
      tags: [Offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                payout:
                  type: number
                  format: double
                status:
                  type: string
                  enum: [draft, published, archived]
      responses:
        '200':
          description: Offer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Offer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete offer (owner/admin only)
      tags: [Offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '204':
          description: Offer deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /offers/{offerId}/tracking-link:
    post:
      summary: Generate tracking link for offer
      tags: [Offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '200':
          description: Tracking link generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tracking_url:
                        type: string
                        format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /offers/{offerId}/request-approval:
    post:
      summary: Request offer approval
      tags: [Offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '201':
          description: Approval request submitted and record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OfferApproval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /offers/{offerId}/favorite:
    post:
      summary: Add offer to favorites
      tags: [Offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '201':
          description: Added to favorites and record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OfferFavorite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /offers/{offerId}/analytics:
    get:
      summary: Get analytics for an offer
      tags: [Offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d, 90d]
            default: 7d
      responses:
        '200':
          description: Offer analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      clicks:
                        type: integer
                      conversions:
                        type: integer
                      earnings:
                        type: number
                      epc:
                        type: number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /marketplace/items:
    get:
      summary: List marketplace items
      tags: [Marketplace]
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated marketplace items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarketplaceItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      summary: Create marketplace item (seller only)
      tags: [Marketplace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, price]
              properties:
                title:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: double
                category:
                  type: string
                images:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Marketplace item created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MarketplaceItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /marketplace/items/{itemId}:
    get:
      summary: Get marketplace item details
      tags: [Marketplace]
      security: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Marketplace item details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MarketplaceItem'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update marketplace item (owner only)
      tags: [Marketplace]
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Marketplace item updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MarketplaceItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      summary: Delete marketplace item (owner only)
      tags: [Marketplace]
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Marketplace item deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /marketplace/items/{itemId}/buy:
    post:
      summary: Purchase marketplace item
      tags: [Marketplace]
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method_id, qty]
              properties:
                payment_method_id:
                  type: string
                qty:
                  type: integer
                  minimum: 1
                shipping:
                  type: object
      responses:
        '201':
          description: Order created with payment intent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      order_id:
                        type: string
                      payment_intent_id:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /marketplace/orders:
    get:
      summary: List orders (filtered by user role)
      tags: [Marketplace]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /communities:
    get:
      summary: List communities
      tags: [Communities]
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated communities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Community'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      summary: Create new community
      tags: [Communities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                private:
                  type: boolean
      responses:
        '201':
          description: Community created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Community'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /communities/{communityId}:
    get:
      summary: Get community details
      tags: [Communities]
      security: []
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Community details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Community'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update community (owner/mod only)
      tags: [Communities]
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Community updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Community'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /communities/{communityId}/join:
    post:
      summary: Join community
      tags: [Communities]
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Joined community
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /communities/{communityId}/members/{userId}/role:
    post:
      summary: Change member role (mod/admin only)
      tags: [Communities]
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [member, moderator, admin]
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
