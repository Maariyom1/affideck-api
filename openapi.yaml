                  type: string
                contentType:
                  type: string
      responses:
        '200':
          description: Signed upload URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signed_url:
                        type: string
                        format: uri
                      public_url:
                        type: string
                        format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'

  /uploads:
    post:
      summary: Upload file to server
      tags: [Uploads]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                        format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'

  /uploads/{uploadId}:
    delete:
      summary: Delete upload (owner only)
      tags: [Uploads]
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Upload deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /content/{slug}:
    get:
      summary: Get public content page
      tags: [Content]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Content page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      title:
                        type: string
                      content:
                        type: string
                      slug:
                        type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /blog:
    get:
      summary: List blog posts
      tags: [Content]
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated blog posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlogPost'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /blog/{slug}:
    get:
      summary: Get blog post
      tags: [Content]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Blog post
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BlogPost'
        '404':
          $ref: '#/components/responses/NotFound'

  /contact:
    post:
      summary: Submit contact form
      tags: [Content]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                message:
                  type: string
                  minLength: 10
      responses:
        '201':
          description: Message submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/ValidationError'

  /search:
    get:
      summary: Search across platform
      tags: [Search]
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [offers, communities, marketplace, users]
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /search/suggestions:
    get:
      summary: Get search suggestions
      tags: [Search]
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string

  /admin/offer-approvals:
    get:
      summary: List pending offer approvals (admin only)
      tags: [Offers]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated offer approval requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfferApproval'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/offer-approvals/{approvalId}/approve:
    patch:
      summary: Approve an offer approval request (admin only)
      tags: [Offers]
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        '200':
          description: Approval accepted and offer published
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OfferApproval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/offer-approvals/{approvalId}/deny:
    patch:
      summary: Deny an offer approval request (admin only)
      tags: [Offers]
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        '200':
          description: Approval denied and offer status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OfferApproval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        plan:
          type: string
        balance:
          type: number
        level:
          type: integer
        streak:
          type: integer
        unreadCounts:
          type: object
          properties:
            notifications:
              type: integer
        permissions:
          type: array
          items:
            type: string
        featureFlags:
          type: object

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        text:
          type: string
        link:
          type: string
          nullable: true
        meta:
          type: object
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Offer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [cpa, cpc, cpv]
        payout:
          type: number
        owner_id:
          type: integer
        status:
          type: string
          enum: [draft, published, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OfferApproval:
      type: object
      properties:
        id:
          type: string
        offer_id:
          type: string
        requested_by:
          type: integer
        requested_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, approved, denied]
        reviewed_by:
          type: integer
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string

    OfferFavorite:
      type: object
      properties:
        id:
          type: string
        offer_id:
          type: string
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time

    MarketplaceItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
        seller_id:
          type: integer
        category:
          type: string
        created_at:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        id:
          type: string
        item_id:
          type: string
        buyer_id:
          type: integer
        total:
          type: number
        status:
          type: string
        created_at:
          type: string
          format: date-time

    Community:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        owner_id:
          type: integer
        private:
          type: boolean
        member_count:
          type: integer
        created_at:
          type: string
          format: date-time

    CommunityPost:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        author_id:
          type: integer
        community_id:
          type: string
        created_at:
          type: string
          format: date-time

    CapitalApplication:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: integer
        amount_requested:
          type: number
        status:
          type: string
          enum: [submitted, under_review, approved, funded, repaying, denied]
        created_at:
          type: string
          format: date-time

    Referral:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        referrer_id:
          type: integer
        created_at:
          type: string
          format: date-time

    ReferralConversion:
      type: object
      properties:
        id:
          type: string
        referral_id:
          type: string
        referred_id:
          type: integer
        created_at:
          type: string
          format: date-time

    ReferralCommission:
      type: object
      properties:
        id:
          type: string
        referral_id:
          type: string
        amount:
          type: number
        status:
          type: string
        created_at:
          type: string
          format: date-time

    UserSettings:
      type: object
      properties:
        theme:
          type: string
        language:
          type: string
        notifications_enabled:
          type: boolean
        two_factor_enabled:
          type: boolean

    BlogPost:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        content:
          type: string
        author_id:
          type: integer
        published_at:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer

    PaginatedFeed:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              text:
                type: string
              link:
                type: string
                nullable: true
              ts:
                type: string
                format: date-time
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/UserProfile'

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1

    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 15
        maximum: 100

    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: Unauthorized (missing or invalid token)
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthenticated.

    Forbidden:
      description: Forbidden (insufficient permissions)
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: This action is unauthorized.

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Not found.

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Core
    description: Core session and navigation
  - name: Notifications
    description: User notifications
  - name: Dashboard
    description: Analytics dashboard
  - name: Offers
    description: Affiliate offers
  - name: Marketplace
    description: Marketplace items and orders
  - name: Communities
    description: User communities
  - name: Capital
    description: Capital lending
